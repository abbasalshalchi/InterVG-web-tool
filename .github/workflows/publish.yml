# Publish Lerpa to npm via trusted publishing.
#
# There is no token here, and there should never be one. npm trusts this repo and
# this workflow file by name, and the runner proves it is them with a short-lived
# OIDC token minted per run. Nothing long-lived exists to leak, expire or rotate.
#
# Provenance -- the signed record of which repo and commit a tarball was built
# from, checked against a public transparency log -- comes automatically on this
# path, so `--provenance` is not passed. It would be redundant.
#
# One-time setup on npmjs.com, under the package's Settings -> Trusted Publisher:
# repository `abbasalshalchi/lerpa`, workflow `publish.yml`. That page
# only exists once the package does, so the very first version has to be published
# by hand; see the Releasing section of the README.

name: Publish

on:
  # Publish whatever version is in package.json, on demand.
  workflow_dispatch:
  # Publish when a GitHub release is created, so the tag and the version agree.
  release:
    types: [published]

permissions:
  contents: read
  id-token: write        # the whole point: this is what npm verifies

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24          # trusted publishing needs node >= 22.14
          registry-url: https://registry.npmjs.org

      # Trusted publishing landed in npm 11.5.1. Pinning the floor explicitly
      # rather than trusting whatever the runner image ships turns a confusing
      # auth failure into something that cannot happen.
      - name: Use an npm that can do trusted publishing
        run: npm install -g npm@latest

      # No `npm ci`: the package has no dependencies and no lockfile. React is
      # an optional peer, so there is nothing to install to run the checks.

      - name: Check the package imports with no DOM
        run: npm test

      - name: Check the version matches the release tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "release tag $tag does not match package.json $version" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
